server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = / {
        return 308 /zh-tax-simulator/;
    }

    location = /zh-tax-simulator {
        return 308 /zh-tax-simulator/;
    }

    location /zh-tax-simulator/ {
        try_files $uri $uri/ =404;
    }

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}

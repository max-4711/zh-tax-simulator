name: Docker-Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Multiarchitektur-Image prüfen
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
      - name: Buildx einrichten
        uses: docker/setup-buildx-action@v4
      - name: ARM64- und AMD64-Image erstellen
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: zh-tax-simulator:ci
